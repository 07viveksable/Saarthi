<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAARTHI â€” Voice Assistant</title>
    <meta name="description"
        content="Talk to SAARTHI in your language. Ask about welfare schemes, benefits and government services.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --saffron: #FF6B1A;
            --saffron-light: #FF8C4A;
            --green: #138808;
            --navy: #0B1B3A;
            --navy-mid: #0F2347;
            --navy-light: #152952;
            --cream: #FFF9F2;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --border: rgba(255, 255, 255, 0.1);
            --white: #ffffff;
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --nav-h: 58px;
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: var(--navy);
            color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow: hidden;
        }

        /* â”€â”€â”€ Background radial glow â”€â”€â”€ */
        .bg-glow {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 70% at 50% 50%, rgba(255, 107, 26, 0.07) 0%, transparent 65%),
                radial-gradient(ellipse 50% 40% at 10% 90%, rgba(19, 136, 8, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse 40% 40% at 90% 10%, rgba(255, 107, 26, 0.05) 0%, transparent 60%);
        }

        /* â”€â”€â”€ NAV â”€â”€â”€ */
        .topnav {
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            height: var(--nav-h);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            background: rgba(11, 27, 58, 0.7);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
        }

        .topnav::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--saffron) 33.33%, rgba(255, 255, 255, 0.5) 33.33% 66.66%, var(--green) 66.66%);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .nav-wordmark {
            font-family: 'Baloo 2', cursive;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -0.4px;
            background: linear-gradient(130deg, #fff 0%, var(--saffron-light) 60%, #D4A017 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-tag {
            font-size: 10px;
            font-weight: 600;
            color: var(--saffron-light);
            background: rgba(255, 107, 26, 0.15);
            border: 1px solid rgba(255, 107, 26, 0.28);
            border-radius: var(--radius-full);
            padding: 3px 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .lang-selector {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 14px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, 0.75);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .lang-selector:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .lang-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--saffron);
        }

        .nav-close {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-close:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        /* â”€â”€â”€ MAIN â”€â”€â”€ */
        main {
            flex: 1;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding: 16px 24px 0;
            min-height: 0;
            overflow: hidden;
        }

        /* â”€â”€â”€ BOTTOM BAR â”€â”€â”€ */
        .bottom-bar {
            flex-shrink: 0;
            background: rgba(11, 27, 58, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding: 14px 24px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 10;
        }

        /* â”€â”€â”€ STATUS BAR â”€â”€â”€ */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 18px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            transition: var(--transition);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: background 0.3s;
        }

        .status-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            font-weight: 500;
        }

        .status-bar.listening {
            border-color: rgba(255, 107, 26, 0.4);
            background: rgba(255, 107, 26, 0.08);
        }

        .status-bar.listening .status-dot {
            background: var(--saffron);
            animation: blink 1s infinite;
        }

        .status-bar.listening .status-text {
            color: var(--saffron-light);
        }

        .status-bar.processing {
            border-color: rgba(99, 102, 241, 0.4);
            background: rgba(99, 102, 241, 0.08);
        }

        .status-bar.processing .status-dot {
            background: #818CF8;
            animation: spin-dot 1s linear infinite;
        }

        .status-bar.processing .status-text {
            color: #A5B4FC;
        }

        .status-bar.speaking {
            border-color: rgba(19, 136, 8, 0.4);
            background: rgba(19, 136, 8, 0.08);
        }

        .status-bar.speaking .status-dot {
            background: var(--green);
            animation: blink 0.7s infinite;
        }

        .status-bar.speaking .status-text {
            color: #4ADE80;
        }

        /* â”€â”€â”€ TRANSCRIPT AREA â”€â”€â”€ */
        .transcript-area {
            width: 100%;
            max-width: 720px;
            align-self: center;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 12px 0 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.1) transparent;
        }

        .transcript-area::-webkit-scrollbar {
            width: 4px;
        }

        .transcript-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .bubble {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            animation: slideUp 0.35s cubic-bezier(0.4, 0, 0.2, 1) both;
        }

        .bubble.user {
            flex-direction: row-reverse;
        }

        .bubble-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .bubble.ai .bubble-avatar {
            background: linear-gradient(135deg, var(--saffron), #FF8B3D);
            color: #fff;
        }

        .bubble.user .bubble-avatar {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
        }

        .bubble-content {
            max-width: 75%;
        }

        .bubble-name {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 5px;
        }

        .bubble.user .bubble-name {
            text-align: right;
        }

        .bubble-text {
            padding: 13px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.6;
            font-weight: 400;
        }

        .bubble.ai .bubble-text {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.09);
            color: rgba(255, 255, 255, 0.9);
            border-radius: 4px 16px 16px 16px;
        }

        .bubble.user .bubble-text {
            background: linear-gradient(135deg, var(--saffron) 0%, #FF8B3D 100%);
            color: #fff;
            border-radius: 16px 4px 16px 16px;
        }

        .bubble-time {
            font-size: 10.5px;
            color: rgba(255, 255, 255, 0.2);
            margin-top: 5px;
        }

        .bubble.user .bubble-time {
            text-align: right;
        }

        /* Typing indicator */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 13px 16px;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            animation: typingBounce 1.2s ease infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        /* â”€â”€â”€ WAVEFORM â”€â”€â”€ */
        .waveform-wrap {
            height: 48px;
            width: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .waveform-wrap.active {
            opacity: 1;
        }

        .wave-bar {
            width: 3px;
            border-radius: 3px;
            background: linear-gradient(180deg, var(--saffron-light), var(--saffron));
            height: 8px;
            animation: waveAnim 1s ease-in-out infinite;
        }

        .wave-bar:nth-child(1) {
            animation-delay: 0.0s;
        }

        .wave-bar:nth-child(2) {
            animation-delay: 0.1s;
        }

        .wave-bar:nth-child(3) {
            animation-delay: 0.2s;
        }

        .wave-bar:nth-child(4) {
            animation-delay: 0.3s;
        }

        .wave-bar:nth-child(5) {
            animation-delay: 0.1s;
        }

        .wave-bar:nth-child(6) {
            animation-delay: 0.25s;
        }

        .wave-bar:nth-child(7) {
            animation-delay: 0.05s;
        }

        .wave-bar:nth-child(8) {
            animation-delay: 0.35s;
        }

        .wave-bar:nth-child(9) {
            animation-delay: 0.15s;
        }

        .wave-bar:nth-child(10) {
            animation-delay: 0.0s;
        }

        .wave-bar:nth-child(11) {
            animation-delay: 0.2s;
        }

        .wave-bar:nth-child(12) {
            animation-delay: 0.1s;
        }

        /* â”€â”€â”€ MIC ROW (inside bottom bar) â”€â”€â”€ */
        .mic-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .mic-ring-wrap {
            position: relative;
            width: 78px;
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Pulse rings */
        .pulse-ring {
            position: absolute;
            border-radius: 50%;
            border: 1.5px solid rgba(255, 107, 26, 0.35);
            animation: pulseRing 2.4s ease-out infinite;
            opacity: 0;
        }

        .pulse-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            animation-delay: 0s;
        }

        .pulse-ring:nth-child(2) {
            width: 100%;
            height: 100%;
            animation-delay: 0.8s;
        }

        .pulse-ring:nth-child(3) {
            width: 100%;
            height: 100%;
            animation-delay: 1.6s;
        }

        .mic-btn {
            position: relative;
            z-index: 2;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--saffron) 0%, #FF4500 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 0 0 5px rgba(255, 107, 26, 0.15),
                0 8px 28px rgba(255, 107, 26, 0.45),
                0 2px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s;
        }

        .mic-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 0 8px rgba(255, 107, 26, 0.2), 0 16px 48px rgba(255, 107, 26, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .mic-btn:active {
            transform: scale(0.96);
        }

        .mic-btn.listening {
            background: linear-gradient(145deg, #EF4444 0%, #DC2626 100%);
            box-shadow: 0 0 0 8px rgba(239, 68, 68, 0.2), 0 12px 40px rgba(239, 68, 68, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
            animation: micPulse 1s ease-in-out infinite;
        }

        .mic-btn.listening .pulse-ring {
            border-color: rgba(239, 68, 68, 0.35);
        }

        .mic-btn.processing {
            background: linear-gradient(145deg, #6366F1 0%, #4F46E5 100%);
            box-shadow: 0 0 0 8px rgba(99, 102, 241, 0.2), 0 12px 40px rgba(99, 102, 241, 0.4), 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .mic-icon {
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mic-label {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 0.04em;
            text-align: center;
            transition: color 0.3s;
        }

        .quick-actions {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quick-label {
            font-size: 11px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-align: center;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .chip {
            padding: 9px 16px;
            border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .chip:hover {
            background: rgba(255, 107, 26, 0.12);
            border-color: rgba(255, 107, 26, 0.35);
            color: var(--saffron-light);
        }

        /* â”€â”€â”€ TRANSCRIPT TOGGLE â”€â”€â”€ */
        .transcript-toggle {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 14px;
            border-radius: var(--radius-full);
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 2px;
        }

        .transcript-toggle:hover {
            border-color: rgba(255, 255, 255, 0.3);
            color: rgba(255, 255, 255, 0.8);
        }

        /* â”€â”€â”€ LANGUAGE DROPDOWN â”€â”€â”€ */
        .lang-dropdown {
            display: none;
            position: absolute;
            top: calc(var(--nav-h) + 8px);
            right: 32px;
            background: var(--navy-mid);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: 8px;
            min-width: 180px;
            z-index: 200;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.2s ease;
        }

        .lang-dropdown.open {
            display: block;
        }

        .lang-option {
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            transition: background 0.15s;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .lang-option.active {
            color: var(--saffron-light);
            background: rgba(255, 107, 26, 0.1);
        }

        .lang-native {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* â”€â”€â”€ ANIMATIONS â”€â”€â”€ */
        @keyframes pulseRing {
            0% {
                transform: scale(0.92);
                opacity: 0.7;
            }

            80% {
                transform: scale(1.45);
                opacity: 0;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.3;
            }
        }

        @keyframes spin-dot {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes micPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes waveAnim {

            0%,
            100% {
                height: 8px;
            }

            50% {
                height: 36px;
            }
        }

        @keyframes typingBounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-8px);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 600px) {
            main {
                padding: 16px 16px 16px;
            }

            .mic-btn {
                width: 82px;
                height: 82px;
            }

            .mic-ring-wrap {
                width: 140px;
                height: 140px;
            }

            .chips {
                gap: 6px;
            }

            .chip {
                font-size: 12px;
                padding: 8px 13px;
            }
        }
    </style>
</head>

<body>

    <div class="bg-glow" aria-hidden="true"></div>

    <!-- â”€â”€â”€ NAV â”€â”€â”€ -->
    <nav class="topnav" aria-label="Primary navigation">
        <a class="nav-brand" href="dashboard.html">
            <span class="nav-wordmark">SAARTHI</span>
            <span class="nav-tag" id="nav-tag">Voice AI</span>
        </a>
        <div class="nav-right">
            <button class="lang-selector" onclick="toggleLang()" type="button" aria-haspopup="listbox"
                aria-label="Select language">
                <span class="lang-dot" aria-hidden="true"></span>
                <span id="current-lang">Hindi</span>
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9" />
                </svg>
            </button>
            <a class="nav-close" href="dashboard.html" aria-label="Close voice assistant">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
                Close
            </a>
        </div>
    </nav>

    <!-- Language dropdown -->
    <!-- Language dropdown (3 languages) -->
    <div class="lang-dropdown" id="lang-dropdown" role="listbox" aria-label="Select language">
        <div class="lang-option active" onclick="setLang('Hindi')">
            <span>Hindi</span><span class="lang-native">&#x939;&#x93F;&#x928;&#x94D;&#x926;&#x940;</span>
        </div>
        <div class="lang-option" onclick="setLang('English')">
            <span>English</span><span class="lang-native">English</span>
        </div>
        <div class="lang-option" onclick="setLang('Marathi')">
            <span>Marathi</span><span class="lang-native">&#x92E;&#x930;&#x93E;&#x920;&#x940;</span>
        </div>
    </div>

    <!-- â”€â”€â”€ MAIN â”€â”€â”€ -->
    <main>

        <!-- Status bar -->
        <div class="status-bar" id="status-bar" role="status" aria-live="polite" style="align-self:center;">
            <div class="status-dot" id="status-dot"></div>
            <span class="status-text" id="status-text">Tap the mic to speak</span>
        </div>

        <!-- Transcript fills remaining height -->
        <div class="transcript-area" id="transcript" aria-label="Conversation transcript" role="log" aria-live="polite">

            <!-- Welcome message from SAARTHI -->
            <div class="bubble ai">
                <div class="bubble-avatar" aria-hidden="true">S</div>
                <div class="bubble-content">
                    <div class="bubble-name">SAARTHI</div>

        /* â”€â”€ Text-to-Speech â”€â”€ */
        function speak(text, onEnd) {
            if (!window.speechSynthesis) { onEnd && onEnd(); return; }
            window.speechSynthesis.cancel();
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = currentLang;
            utter.rate = 0.95; // Slightly faster for natural flow
            utter.pitch = 1.0;
            utter.volume = 1;

            const voices = speechSynthesis.getVoices();
            const langCode = currentLang.split('-')[0]; // 'hi' or 'mr' or 'en'
            
            // Filter all voices for current language
            const langVoices = voices.filter(v => v.lang.startsWith(langCode));
            
            // Intelligent prioritization:
            // 1. Look for "Natural" (Microsoft Edge quality)
            // 2. Look for "Google" (Chrome high quality)
            // 3. Look for "Premium" or "Online"
            // 4. Default to first available for language
            let bestVoice = langVoices.find(v => v.name.includes('Natural')) ||
                            langVoices.find(v => v.name.includes('Google')) ||
                            langVoices.find(v => v.name.includes('Online')) ||
                            langVoices.find(v => v.name.includes('Premium')) ||
                            langVoices[0];

            if (bestVoice) {
                utter.voice = bestVoice;
                // If it's a known "Natural" voice, rate 1.0 is usually better
                if (bestVoice.name.includes('Natural')) utter.rate = 1.0;
            }

            utter.onend = () => { setState('idle'); if(onEnd) onEnd(); };
            utter.onerror = () => { setState('idle'); if(onEnd) onEnd(); };
            speechSynthesis.speak(utter);
        }

        const OLLAMA_URL  = 'http://localhost:11434/api/generate';

        const LANG_NAMES = {
            'hi-IN':'Hindi','en-IN':'English','mr-IN':'Marathi',
            'bn-IN':'Bengali','te-IN':'Telugu','ta-IN':'Tamil',
            'gu-IN':'Gujarati','pa-IN':'Punjabi'
        };

        async function askOllama(question) {
            const langName = LANG_NAMES[currentLang] || 'English';
            const res = await fetch('http://localhost:8000/api/ask', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    question: question,
                    language: langName
                }),
                signal: AbortSignal.timeout(30000)
            });
            if (!res.ok) throw new Error('Ask API HTTP ' + res.status);
            const data = await res.json();
            if (!data.answer) throw new Error('Empty answer');
            return data.answer;
        }

        }

        /* -- Answer question: try Ollama first, fall back to KB -- */
        async function answerQuestion(userText) {
            setState('processing');
            addTypingIndicator();

            // ── Run emotion detection + scheme classification in parallel ──
            const [emotionData, schemeData] = await Promise.all([
                detectEmotion(userText),
                classifyScheme(userText)
            ]);

            // ── React to emotion if API is running ──
            if (emotionData) {
                console.log('Emotion detected:', emotionData);
                if (emotionData.emotion === 'crisis') {
                    showCrisisAlert();
                } else if (emotionData.emotion === 'distressed') {
                    showDistressAlert(schemeData);
                }
            }

            // ── Get answer from Ollama or fallback KB ──
            let answer = '';
            try {
                answer = await askOllama(userText);
            } catch (e) {
                // Ollama not running or error -- use keyword KB
                answer = getAnswer(userText);
            }
            removeTypingIndicator();
            addBubble('ai', answer);
            setState('speaking');
            speak(answer);
        }

        /* -- Deliver a pre-known answer (used by quick chips) -- */
        function deliverAnswer(text) {
            setState('speaking');
            addTypingIndicator();
            setTimeout(() => {
                removeTypingIndicator();
                addBubble('ai', text);
                speak(text);
            }, 700);
        }

        /* â”€â”€ Speech Recognition setup â”€â”€ */
        function initRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;
            const r = new SR();
            r.continuous = false;
            r.interimResults = true;
            r.maxAlternatives = 1;
            r.lang = currentLang;

            r.onstart = () => setState('listening');

            r.onresult = (e) => {
                const interim = Array.from(e.results).map(r => r[0].transcript).join('');
                statusTxt.textContent = interim || 'Listeningâ€¦';
                if (e.results[e.results.length - 1].isFinal) {
                    const finalText = e.results[e.results.length - 1][0].transcript.trim();
                    if (finalText) {
                        setState('processing');
                        addBubble('user', finalText);
                        answerQuestion(finalText);
                    } else {
                        setState('idle');
                    }
                }
            };

            r.onerror = (e) => {
                console.warn('Speech recognition error:', e.error);
                if (e.error === 'not-allowed') {
                    addBubble('ai', 'Microphone access was denied. Please allow microphone access in your browser settings and try again.');
                } else if (e.error === 'no-speech') {
                    addBubble('ai', 'I did not hear anything. Please try speaking again.');
                }
                setState('idle');
            };

            r.onend = () => { if (state === 'listening') setState('idle'); };
            return r;
        }

        /* â”€â”€ Mic button toggle â”€â”€ */
        function toggleMic() {
            if (state === 'listening') {
                // Stop listening
                if (recognition) recognition.stop();
                setState('idle');
                return;
            }
            if (state === 'speaking') {
                // Interrupt SAARTHI
                window.speechSynthesis && window.speechSynthesis.cancel();
                setState('idle');
                return;
            }

            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                addBubble('ai', 'Your browser does not support voice recognition. Please use Google Chrome or Microsoft Edge for the best experience. You can still use the quick buttons below.');
                return;
            }

            recognition = initRecognition();
            try { recognition.start(); }
            catch (e) { console.warn(e); }
        }

        /* â”€â”€ Quick chip shortcut â”€â”€ */
        function quickAsk(question) {
            if (state === 'speaking') window.speechSynthesis && window.speechSynthesis.cancel();
            recognition && recognition.abort();
            setState('processing');
            addBubble('user', question);
            answerQuestion(question);
        }

        /* â”€â”€ Bubble helpers â”€â”€ */
        function addBubble(role, text) {
            const time = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
            const isAI = role === 'ai';
            const el = document.createElement('div');
            el.className = 'bubble ' + role;
            el.innerHTML = `
              <div class="bubble-avatar" aria-hidden="true">${isAI ? 'S' : 'U'}</div>
              <div class="bubble-content">
                <div class="bubble-name">${isAI ? 'SAARTHI' : 'You'}</div>
                <div class="bubble-text">${text}</div>
                <div class="bubble-time">${time}</div>
              </div>`;
            transcript.appendChild(el);
            transcript.scrollTop = transcript.scrollHeight;
        }

        let typingEl = null;
        function addTypingIndicator() {
            typingEl = document.createElement('div');
            typingEl.className = 'bubble ai';
            typingEl.innerHTML = `
              <div class="bubble-avatar" aria-hidden="true">S</div>
              <div class="bubble-content">
                <div class="bubble-name">SAARTHI</div>
                <div class="bubble-text typing-indicator">
                  <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
                </div>
              </div>`;
            transcript.appendChild(typingEl);
            transcript.scrollTop = transcript.scrollHeight;
        }
        function removeTypingIndicator() { if (typingEl) { typingEl.remove(); typingEl = null; } }

        function clearTranscript() {
            const bubbles = transcript.querySelectorAll('.bubble');
            bubbles.forEach((b, i) => { if (i > 0) b.remove(); });
        }

        /* â”€â”€ Language switcher â”€â”€ */
        function toggleLang() { document.getElementById('lang-dropdown').classList.toggle('open'); }
        function setLang(name) {
            currentLang = LANG_CODES[name] || 'en-IN';
            document.getElementById('current-lang').textContent = name;
            document.getElementById('lang-dropdown').classList.remove('open');
            document.querySelectorAll('.lang-option').forEach(o => {
                o.classList.toggle('active', o.querySelector('span').textContent.trim() === name);
            });
            if (window.speechSynthesis) speechSynthesis.getVoices();
            // Apply full UI translation
            applyUIStrings(currentLang);
            // Update state labels for current state
            setState(state);
        }
        document.addEventListener('click', e => {
            if (!e.target.closest('.lang-selector') && !e.target.closest('#lang-dropdown'))
                document.getElementById('lang-dropdown').classList.remove('open');
        });

        // Pre-load voices on page ready
        if (window.speechSynthesis) {
            speechSynthesis.getVoices();
            speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
        }
        applyUIStrings(currentLang); setState(state);
    </script>

</body>
